services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: remitano
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d remitano"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: node:20-alpine
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/remitano?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-secret-dev-secret-dev-secret-dev
      JWT_ACCESS_TTL: "7d"
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: debug
    volumes:
      - .:/workspace
    ports:
      - "3001:3001"
    command: >
      sh -c "
        corepack enable &&
        corepack prepare pnpm@10.15.0 --activate &&
        pnpm install --frozen-lockfile=false &&
        pnpm --filter api prisma generate &&
        pnpm --filter api prisma migrate deploy &&
        pnpm --filter api prisma db seed &&
        pnpm --filter api dev
      "

  web:
    image: node:20-alpine
    working_dir: /workspace
    depends_on:
      - api
    environment:
      VITE_API_PROXY: http://api:3001
    volumes:
      - .:/workspace
    ports:
      - "5173:5173"
    command: >
      sh -c "
        corepack enable &&
        corepack prepare pnpm@10.15.0 --activate &&
        pnpm install --frozen-lockfile=false &&
        pnpm --filter web dev
      "

volumes:
  postgres_data:
